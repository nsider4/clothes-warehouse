<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Item Requests</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
<div class="container my-4">
    <div class="d-flex justify-content-end">
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="btn btn-outline-danger">Logout</button>
        </form>
    </div>
</div>

<div class="container mt-5">
    <h2 class="mb-4">Submitted Item Requests</h2>

    <form class="row g-3 mb-4" method="get" th:action="@{/admin/item-requests}">
        <div class="col-md-4">
            <input type="number" class="form-control" name="minQuantity" placeholder="Min Quantity" th:value="${param.minQuantity}">
        </div>
        <div class="col-md-4">
            <select class="form-select" name="status">
                <option value="">Status</option>
                <option value="Pending" th:selected="${param.status == 'Pending'}">Pending</option>
                <option value="Approved" th:selected="${param.status == 'Approved'}">Approved</option>
            </select>
        </div>
        <div class="col-md-2">
            <button type="submit" class="btn btn-success w-100">Apply Filters</button>
        </div>
        <div class="col-md-2">
            <a th:href="@{/admin/item-requests}" class="btn btn-secondary w-100">Clear Filters</a>
        </div>
    </form>

    <form class="row g-3 mb-4" method="get" th:action="@{/admin/item-requests}">
        <div class="col-md-4">
            <select class="form-select" name="sort">
                <option value="">Sort By</option>
                <option value="quantityAsc" th:selected="${param.sort == 'quantityAsc'}">Quantity (Low to High)</option>
                <option value="quantityDesc" th:selected="${param.sort == 'quantityDesc'}">Quantity (High to Low)</option>
                <option value="statusAsc" th:selected="${param.sort == 'statusAsc'}">Status (A-Z)</option>
                <option value="statusDesc" th:selected="${param.sort == 'statusDesc'}">Status (Z-A)</option>
            </select>
        </div>
        <div class="col-md-2">
            <button type="submit" class="btn btn-primary w-100">Sort</button>
        </div>
    </form>

    <table class="table table-bordered table-striped">
        <thead>
        <tr>
            <th>ID</th>
            <th>Quantity</th>
            <th>Source Centre ID</th>
            <th>Destination Centre ID</th>
            <th>Status</th>
            <th th:if="${#authorization.expression('hasRole(''ADMIN'')') or #authorization.expression('hasRole(''WAREHOUSE_EMPLOYEE'')')}">Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="request : ${requests}">
            <td th:text="${request.id}"></td>
            <td th:text="${request.quantity}"></td>
            <td th:text="${request.sourceCentreId}"></td>
            <td th:text="${request.destinationCentreId}"></td>
            <td th:text="${request.status}"></td>
            <td th:if="${#authorization.expression('hasRole(''ADMIN'')') or #authorization.expression('hasRole(''WAREHOUSE_EMPLOYEE'')')}">
                <a th:if="${request.status != 'Approved'}"
                   th:href="@{/admin/item-requests/approve/{id}(id=${request.id})}"
                   class="btn btn-success btn-sm">Approve</a>

                <button th:if="${#authorization.expression('hasRole(''ADMIN'')')}"
                        class="btn btn-danger btn-sm"
                        data-bs-toggle="modal"
                        data-bs-target="#confirmDeleteModal"
                        th:attr="data-id=${request.id}">
                    Delete
                </button>
            </td>
        </tr>
        </tbody>
    </table>

    <a th:if="${#authorization.expression('hasRole(''ADMIN'')') or #authorization.expression('hasRole(''WAREHOUSE_EMPLOYEE'')')}"
       href="/admin/request-form"
       class="btn btn-warning mt-3">Create New Request Form</a>
</div>

<div class="modal fade" id="confirmDeleteModal" tabindex="-1" aria-labelledby="confirmDeleteLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="confirmDeleteLabel">Confirm Delete</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                Are you sure you want to delete this item request?
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <a id="confirmDeleteBtn" href="#" class="btn btn-danger">Delete</a>
            </div>
        </div>
    </div>
</div>

<div class="container mt-3">
    <a href="/admin/dashboard" class="btn btn-secondary">Back to Dashboard</a>
</div>

<script>
    const deleteModal = document.getElementById('confirmDeleteModal');
    deleteModal.addEventListener('show.bs.modal', function (event) {
        const button = event.relatedTarget;
        const requestId = button.getAttribute('data-id');
        const confirmBtn = document.getElementById('confirmDeleteBtn');
        confirmBtn.href = `/admin/item-requests/delete/${requestId}`;
    });
</script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Item Requests</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
<div class="container mt-5">
    <h2 class="mb-4">Submitted Item Requests</h2>

    <table class="table table-bordered table-striped">
        <thead>
        <tr>
            <th>ID</th>
            <th>Quantity</th>
            <th>Source Centre ID</th>
            <th>Destination Centre ID</th>
            <th>Status</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="request : ${requests}">
            <td th:text="${request.id}"></td>
            <td th:text="${request.quantity}"></td>
            <td th:text="${request.sourceCentreId}"></td>
            <td th:text="${request.destinationCentreId}"></td>
            <td th:text="${request.status}"></td>
            <td>
                <a th:if="${request.status != 'Approved'}"
                   th:href="@{/admin/item-requests/approve/{id}(id=${request.id})}"
                   class="btn btn-success btn-sm">Approve</a>
                <button
                        class="btn btn-danger btn-sm"
                        data-bs-toggle="modal"
                        data-bs-target="#confirmDeleteModal"
                        th:attr="data-id=${request.id}">
                    Delete
                </button>
            </td>
        </tr>
        </tbody>
    </table>

    <a href="/admin/request-form" class="btn btn-secondary mt-3">Back to Request Form</a>
</div>

<div class="modal fade" id="confirmDeleteModal" tabindex="-1" aria-labelledby="confirmDeleteLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="confirmDeleteLabel">Confirm Delete</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                Are you sure you want to delete this item request?
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <a id="confirmDeleteBtn" href="#" class="btn btn-danger">Delete</a>
            </div>
        </div>
    </div>
</div>

<script>
    const deleteModal = document.getElementById('confirmDeleteModal');
    deleteModal.addEventListener('show.bs.modal', function (event) {
        const button = event.relatedTarget;
        const requestId = button.getAttribute('data-id');
        const confirmBtn = document.getElementById('confirmDeleteBtn');
        confirmBtn.href = `/admin/item-requests/delete/${requestId}`;
    });
</script>
</body>
</html>

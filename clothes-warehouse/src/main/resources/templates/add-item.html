<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Item</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">
<div class="container my-4">
    <div class="d-flex justify-content-end">
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="btn btn-outline-danger">Logout</button>
        </form>
    </div>
</div>

<h2 class="text-center">Add Item to Stock</h2>

<form th:action="@{/admin/add-item}" method="post" th:object="${item}" class="mt-4">
    <div class="mb-3">
        <label class="form-label">Item Name:</label>
        <input type="text" class="form-control" th:field="*{name}">
        <p class="text-danger" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>
    </div>

    <div class="mb-3">
        <label class="form-label">Brand:</label>
        <select class="form-control" th:field="*{brand}">
            <option th:each="brand : ${brands}" th:value="${brand}" th:text="${brand}"></option>
        </select>
        <p class="text-danger" th:if="${#fields.hasErrors('brand')}" th:errors="*{brand}"></p>
    </div>

    <div class="mb-3">
        <label class="form-label">Year of Creation:</label>
        <input type="number" class="form-control" th:field="*{yearOfCreation}">
        <p class="text-danger" th:if="${#fields.hasErrors('yearOfCreation')}" th:errors="*{yearOfCreation}"></p>
    </div>

    <div class="mb-3">
        <label class="form-label">Price:</label>
        <input type="number" step="0.01" class="form-control" th:field="*{price}">
        <p class="text-danger" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></p>
    </div>

    <div class="mb-3">
        <label class="form-label">Quantity:</label>
        <input type="number" class="form-control" th:field="*{quantity}">
        <p class="text-danger" th:if="${#fields.hasErrors('quantity')}" th:errors="*{quantity}"></p>
    </div>

    <div class="mb-3">
        <label class="form-label">Assign to Distribution Centre:</label>
        <select class="form-control" name="centreId" required>
            <option value="" disabled selected>Select a centre</option>
            <option th:each="centre : ${centres}" th:value="${centre.id}" th:text="${centre.name}"></option>
        </select>
    </div>

    <button type="submit" class="btn btn-primary">Add Item</button>
</form>

<div th:if="${param.success}" class="alert alert-success mt-3">Item added successfully!</div>

<div class="container mt-3">
    <a href="/admin/dashboard" class="btn btn-secondary">Back to Dashboard</a>
</div>
</body>
</html>

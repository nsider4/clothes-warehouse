<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Item List</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Items in Stock</h2>
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="btn btn-outline-danger">Logout</button>
        </form>
    </div>

    <h2 class="text-center mb-4">Items in Stock</h2>

    <form th:action="@{/filter}" method="get" class="mb-4 p-3 border rounded bg-light d-flex flex-wrap align-items-center gap-2">
        <div class="d-flex align-items-center">
            <label for="brand" class="me-2 fw-bold">Brand:</label>
            <select id="brand" name="brand" class="form-select w-auto">
                <option th:each="brand : ${brands}" th:value="${brand}" th:text="${brand}"
                        th:selected="${brand == selectedBrand}"></option>
            </select>
        </div>

        <div class="d-flex align-items-center">
            <label for="year" class="me-2 fw-bold">Year:</label>
            <input type="number" id="year" name="year" class="form-control w-auto" value="2022">
        </div>

        <input type="hidden" name="sortBy" th:value="${param.sortBy}">

        <button type="submit" class="btn btn-primary">Apply Filters</button>
        <a href="/items" class="btn btn-outline-secondary">Clear Filters</a>
    </form>

    <table class="table table-striped table-hover">
        <thead class="table-dark">
        <tr>
            <th><a th:href="@{/items(sortBy='name')}" class="text-light text-decoration-none">Name</a></th>
            <th><a th:href="@{/items(sortBy='brand')}" class="text-light text-decoration-none">Brand</a></th>
            <th>Year of Creation</th>
            <th><a th:href="@{/items(sortBy='price')}" class="text-light text-decoration-none">Price</a></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="item : ${items}">
            <td th:text="${item.name}"></td>
            <td th:text="${item.brand}"></td>
            <td th:text="${item.yearOfCreation}"></td>
            <td th:text="${item.price}"></td>
            <td>
                <form th:action="@{/delete-item/{id}(id=${item.id})}" method="post"
                      th:if="${#authentication != null and #authorization.expression('hasRole(''ADMIN'')')}">
                    <button type="submit" class="btn btn-danger">Delete</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

    <div th:if="${items.isEmpty()}" class="alert alert-warning text-center">
        No items found for the selected criteria.
    </div>

    <div th:if="${items.totalPages > 1}" class="d-flex justify-content-between mt-4">
        <a th:if="${items.hasPrevious()}"
           th:href="@{/items(page=${items.number - 1}, sortBy=${param.sortBy})}"
           class="btn btn-secondary">Previous</a>

        <span class="align-self-center">Page <span th:text="${items.number + 1}"></span> of <span th:text="${items.totalPages}"></span></span>

        <a th:if="${items.hasNext()}"
           th:href="@{/items(page=${items.number + 1}, sortBy=${param.sortBy})}"
           class="btn btn-secondary">Next</a>
    </div>

    <div th:if="${selectedBrand != null && items.totalPages > 1}" class="d-flex justify-content-between mt-3">
        <a th:if="${items.hasPrevious()}"
           th:href="@{/filter(brand=${selectedBrand}, year=${param.year}, page=${items.number - 1}, sortBy=${param.sortBy})}"
           class="btn btn-secondary">Previous</a>

        <span class="align-self-center">Page <span th:text="${items.number + 1}"></span> of <span th:text="${items.totalPages}"></span></span>

        <a th:if="${items.hasNext()}"
           th:href="@{/filter(brand=${selectedBrand}, year=${param.year}, page=${items.number + 1}, sortBy=${param.sortBy})}"
           class="btn btn-secondary">Next</a>
    </div>

    <div class="mt-4 text-center">
        <a href="/add-item" class="btn btn-success">Add New Item</a>
    </div>
</body>
</html>

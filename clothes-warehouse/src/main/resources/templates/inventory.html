<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Inventory for Distribution Centre</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-5">
    <h1>Inventory for Distribution Centre: <span th:text="${centre.name}"></span></h1>
    <h4>Location:
        Latitude <span th:text="${centre.latitude}"></span>,
        Longitude <span th:text="${centre.longitude}"></span>
    </h4>

    <table class="table table-bordered table-striped">
        <thead>
        <tr>
            <th>Item Name</th>
            <th>Brand</th>
            <th>Quantity</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="item : ${centre.items}">
            <td th:text="${item.name}"></td>
            <td th:text="${item.brand}"></td>
            <td th:text="${item.quantity}"></td>
        </tr>
        </tbody>
    </table>

    <a href="/admin/distribution-centres" class="btn btn-primary">Back to Distribution Centres</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

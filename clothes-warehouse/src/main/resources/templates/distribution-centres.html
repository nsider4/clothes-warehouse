<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Distribution Centres</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-5">
    <h1>Distribution Centres</h1>

    <table class="table table-bordered table-striped">
        <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Latitude</th>
            <th>Longitude</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="centre : ${centres}">
            <td th:text="${centre.id}"></td>
            <td th:text="${centre.name}"></td>
            <td th:text="${centre.latitude}"></td>
            <td th:text="${centre.longitude}"></td>
            <td>
                <a th:href="@{/admin/distribution-centres/{id}/inventory(id=${centre.id})}" class="btn btn-info btn-sm">View Inventory</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
